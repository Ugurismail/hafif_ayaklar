{% extends 'core/base.html' %}
{% load static %}
{% block extra_css %}<link rel="stylesheet" href="{% static 'css/password_visibility.css' %}">{% endblock %}
{% block extra_js %}<script defer src="{% static 'js/password_visibility.js' %}"></script>{% endblock %}

{% block content %}
<div class="container mt-5 d-flex justify-content-center">
    <div class="card shadow-sm" style="max-width: 400px; width: 100%;">
        <div class="card-body">
            <h2 class="card-title text-center mb-4">Giriş Yap</h2>
            <form method="post" id="login-form" data-password-controls>
                {% csrf_token %}
                <input type="hidden" name="next" value="{{ next }}">
                <div class="mb-3">
                    <label for="{{ form.username.id_for_label }}" class="form-label">Kullanıcı Adı</label>
                    {{ form.username }}
                </div>
                <div class="mb-3">
                    <label for="{{ form.password.id_for_label }}" class="form-label">Şifre</label>
                    {{ form.password }}
                </div>
                <div class="form-check mb-3">
                    <input class="form-check-input" type="checkbox" name="remember_me" id="rememberMe"{% if remember_me %} checked{% endif %}>
                    <label class="form-check-label" for="rememberMe">Beni hatırla</label>
                </div>
                <button type="submit" class="btn btn-theme-primary w-100">Giriş Yap</button>
            </form>
            <hr>
            <p class="text-center mb-0">
                Henüz hesabınız yok mu? <a href="{% url 'signup' %}">Kayıt Olun</a>
            </p>
        </div>
    </div>
</div>

{% endblock %}
