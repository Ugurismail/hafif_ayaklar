<span class="invitation-code">
  <code class="invitation-code-value">{{ code }}</code>
  <button type="button" class="invitation-copy-button" data-copy-invitation="{{ code }}" title="Davet kodunu kopyala" aria-label="Davet kodunu kopyala">
    <i class="bi bi-clipboard" aria-hidden="true"></i>
  </button>
  <span class="visually-hidden" data-copy-status role="status" aria-live="polite"></span>
</span>
